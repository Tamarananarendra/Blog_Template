<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validation Project</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        small {
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Registration Form</h2>
    <form id="registrationForm" novalidate>
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" required>
            <small id="nameError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email ID</label>
            <input type="email" id="email" class="form-control" required>
            <small id="emailError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" id="phone" class="form-control" required>
            <small id="phoneError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
            <small id="passwordError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" required>
            <small id="confirmPasswordError" class="text-danger"></small>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
</div>

<!-- JavaScript -->
<script>

    document.getElementById('registrationForm').addEventListener('submit', function (e) {
        e.preventDefault();        if (validateForm()) {
            alert("Form submitted successfully!");
            // After successful validation, you can send the form data to server if needed
            document.getElementById('registrationForm').reset();
        }
    });


    function validateForm() {
        let valid = true;

        if (!validateName()) valid = false;
        if (!validateEmail()) valid = false;
        if (!validatePhone()) valid = false;
        if (!validatePassword()) valid = false;
        if (!validateConfirmPassword()) valid = false;

        return valid;
    }


    function validateName() {
        let name = document.getElementById('fullName').value.trim();
        let error = document.getElementById('nameError');

        if (name.length < 5) {
            error.innerText = "Name must be at least 5 characters long.";
            return false;
        } else {
            error.innerText = "";
            return true;
        }
    }

   
    function validateEmail() {
        let email = document.getElementById('email').value.trim();
        let error = document.getElementById('emailError');

        if (!email.includes("@")) {
            error.innerText = "Enter a valid email address.";
            return false;
        } else {
            error.innerText = "";
            return true;
        }
    }

   
    function validatePhone() {
        let phone = document.getElementById('phone').value.trim();
        let error = document.getElementById('phoneError');

        if (phone.length !== 10 || phone === "1234567890" || isNaN(phone)) {
            error.innerText = "Enter a valid 10-digit phone number.";
            return false;
        } else {
            error.innerText = "";
            return true;
        }
    }


    function validatePassword() {
        let password = document.getElementById('password').value;
        let name = document.getElementById('fullName').value.trim().toLowerCase();
        let error = document.getElementById('passwordError');

        if (password.length < 8 || password.toLowerCase() === 'password' || password.toLowerCase() === name) {
            error.innerText = "Password must be strong and not 'password' or your name.";
            return false;
        } else {
            error.innerText = "";
            return true;
        }
    }
    function validateConfirmPassword() {
        let password = document.getElementById('password').value;
        let confirmPassword = document.getElementById('confirmPassword').value;
        let error = document.getElementById('confirmPasswordError');

        if (password !== confirmPassword) {
            error.innerText = "Passwords do not match.";
            return false;
        } else {
            error.innerText = "";
            return true;
        }
    }
</script>

</body>
</html>
